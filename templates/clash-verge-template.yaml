# ============================================================
# Clash Verge / mihomo — 11 层 AI 优化架构 v5 收尾版
# 两元店机场（lyhycloud）+ 全部 24 项实战优化 + 5 项专业评审收尾修正
# 生成时间：2026-10-05
# v5 新增：tcp-concurrent / sniffer / geodata / GeoSite / nameserver-policy / max-failed-times
# v5 收尾：skip-cert-verify:false / sniffer 稳模式 / TUN 开启 / 广告 GEOSITE / Apple/MS 补全
# ============================================================

mode: rule
mixed-port: 7897
allow-lan: false
log-level: warning
ipv6: false                              # #1 禁 IPv6
external-controller: 127.0.0.1:9097
secret: verge-admin-2026
unified-delay: true
bind-address: '*'
external-controller-pipe: \\.\pipe\verge-mihomo

# ====== v5 新增全局优化 ======
tcp-concurrent: true                     # #15 并发建连，自动选最快的 TCP 链路
geodata-mode: true                       # #16 用 dat 格式替代 mmdb，内存-40%，查询更快
geox-url:                                # dat 格式自动下载地址
  geoip: https://github.com/MetaCubeX/meta-rules-dat/releases/latest/download/geoip.dat
  geosite: https://github.com/MetaCubeX/meta-rules-dat/releases/latest/download/geosite.dat
  mmdb: https://github.com/MetaCubeX/meta-rules-dat/releases/latest/download/country.mmdb
geo-auto-update: true                    # 自动更新 geo 数据库
geo-update-interval: 168                 # 每周更新一次
keep-alive-interval: 30                  # #17 保活间隔 15→30s，省流量省电
global-client-fingerprint: chrome        # #18 全局 TLS 指纹统一为 chrome

tun:
  enable: true                             # v5 收尾：开启 TUN，CLI/游戏/App 也走规则
  stack: gvisor
  auto-route: true
  auto-redirect: true
  strict-route: true
  auto-detect-interface: true
  dns-hijack:
  - any:53

external-controller-cors:
  allow-private-network: true
  allow-origins:
  - tauri://localhost
  - http://tauri.localhost
  - https://yacd.metacubex.one
  - https://metacubex.github.io
  - https://board.zash.run.place

# ============================================================
# Sniffer 嗅探器 — 从 TLS SNI / HTTP Host 还原真实域名
# #19 fake-ip 模式下让 DOMAIN 规则精准命中（不再靠 GeoIP 兜底）
# v5 收尾：稳模式 — parse-pure-ip:false / override-destination:false
#          不对纯 IP 嗅探，不覆盖证书固定连接，银行/Apple 不报错
# ============================================================
sniffer:
  enable: true
  force-dns-mapping: true                # 对 fake-ip 的连接也启用嗅探
  parse-pure-ip: false                   # v5 收尾：不对纯 IP 连接嗅探（银行/企业服务）
  override-destination: false            # v5 收尾：不覆盖目标地址（证书固定应用安全）
  sniff:
    TLS:
      ports:
      - 443
      - 8443
    HTTP:
      ports:
      - 80
      - 8080-8880
    QUIC:
      ports:
      - 443
      - 8443
  skip-domain:                           # v5 收尾：不嗅探的域名（银行/Apple/智能家居）
  - '+.bank.example'
  - '+.icbc.com.cn'
  - '+.cmbchina.com'
  - '+.bankcomm.com'
  - 'Mijia Cloud'
  - '+.apple.com'
  - '+.icloud.com'

# ============================================================
# DNS — fake-ip + AI 域名真实解析 + DoH fallback + 分域名分流
# ============================================================
dns:
  enable: true
  listen: :53
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  prefer-h3: false
  respect-rules: true
  use-hosts: true
  use-system-hosts: false
  fake-ip-filter:
  - '*.lan'
  - '*.local'
  - '*.arpa'
  - time.*.com
  - ntp.*.com
  - +.market.xiaomi.com
  - localhost.ptlogin2.qq.com
  - '*.msftncsi.com'
  - www.msftconnecttest.com
  # AI 服务域名 — 需要真实 DNS 解析（fake-ip 会被检测）
  - +.openai.com
  - +.chatgpt.com
  - +.anthropic.com
  - +.claude.ai
  - +.gemini.google.com
  - +.generativelanguage.googleapis.com
  default-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  nameserver:
  - https://doh.pub/dns-query
  - https://dns.alidns.com/dns-query
  - 223.5.5.5
  fallback:
  - https://1.1.1.1/dns-query
  - https://dns.google/dns-query
  - tls://8.8.8.8:853
  # #20 nameserver-policy — AI 域名直接走 Google DoH，比国内 DoH 快 200ms+
  nameserver-policy:
    "+.openai.com": https://dns.google/dns-query
    "+.chatgpt.com": https://dns.google/dns-query
    "+.oaistatic.com": https://dns.google/dns-query
    "+.anthropic.com": https://dns.google/dns-query
    "+.claude.ai": https://dns.google/dns-query
    "+.gemini.google.com": https://dns.google/dns-query
    "+.generativelanguage.googleapis.com": https://dns.google/dns-query
    "+.perplexity.ai": https://dns.google/dns-query
    "+.x.ai": https://dns.google/dns-query
  proxy-server-nameserver:
  - https://doh.pub/dns-query
  - https://dns.alidns.com/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
    - 240.0.0.0/4
    - 0.0.0.0/32
    domain:
    - +.google.com
    - +.facebook.com
    - +.youtube.com

profile:
  store-selected: true

# ============================================================
# 节点定义（订阅会自动更新覆盖）
# global-client-fingerprint: chrome 已全局设置，节点不再单独写
