# ============================================================
# 11 层策略组
# ============================================================
proxy-groups:

# 顶层选择器
- name: 两元店
  type: select
  proxies:
  - Google-AI
  - AI-Proxy
  - CF-Strict
  - Note-Tools
  - Dev-AI
  - Social
  - Dev-Svc
  - Web3
  - Finance
  - Game-Media
  - Shopping
  - Proxy
  - DIRECT

# ① Google-AI（Gemini 全家桶）— 排除 LU/UK/JP，-02 优先
- name: Google-AI
  type: fallback
  lazy: false
  max-failed-times: 3                    # #21 连续失败 3 次自动切节点
  url: https://www.gstatic.com/generate_204
  interval: 300
  proxies:
  - SG-02
  - USA-02
  - SG-01
  - USA-01
  - AU-02
  - AU-01
  - HK-02
  - HK-01

# ② AI-Proxy（ChatGPT/Claude/Grok）— 排除 HK/UK，-02 优先
- name: AI-Proxy
  type: fallback
  lazy: false
  max-failed-times: 3
  url: https://chatgpt.com/cdn-cgi/trace
  interval: 300
  proxies:
  - SG-02
  - USA-02
  - SG-01
  - USA-01
  - AU-02
  - AU-01
  - JP-02
  - LU-02
  - LU-01

# ③ 笔记-工具
