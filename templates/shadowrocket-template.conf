# Shadowrocket Template — 11-Layer AI-Optimized Architecture
# v1.1.0 — battle-tested with real airports (iOS)
#
# Usage:
#   1. Import this as a config file in Shadowrocket
#   2. Replace node names with your actual nodes
#   3. Or use: clash-ai generate --config your-sub.yaml --format shadowrocket --output optimized.conf
#
# Key optimizations (see docs/pitfalls.md for details):
#   - IPv6 disabled → prevents leaks
#   - DoH fallback → tamper-resistant DNS
#   - -02 nodes first → proven lower jitter
#   - greedy keyword fix → service rules BEFORE DOMAIN-KEYWORD,google

[General]
bypass-system-rules = true
udp-policy-not-follow-proxy = false
ipv6 = false
dns-server = 223.5.5.5, 119.29.29.29, system
fallback-dns-server = https://1.1.1.1/dns-query
proxy-test-url = https://www.gstatic.com/generate_204

[Proxy]
# === Replace PLACEHOLDER nodes with your actual nodes ===

# Layer 1: Google-AI (Gemini) — exclude LU/UK, -02 priority
# Google-AI = fallback, url=https://www.gstatic.com/generate_204, interval=300, timeout=5000, PLACEHOLDER-SG-02, PLACEHOLDER-USA-02, PLACEHOLDER-SG-01, PLACEHOLDER-USA-01, PLACEHOLDER-JP-02

# Layer 2: AI-Services (ChatGPT/Claude/Grok) — exclude HK/UK, -02 priority
# AI-Services = fallback, url=https://chatgpt.com/cdn-cgi/trace, interval=300, timeout=5000, PLACEHOLDER-SG-02, PLACEHOLDER-USA-02, PLACEHOLDER-SG-01, PLACEHOLDER-USA-01, PLACEHOLDER-JP-02

# Layer 3: CF-Strict (Cloudflare Bot Management) — manual select
# CF-Strict = select, url=https://www.gstatic.com/generate_204, interval=300, PLACEHOLDER-SG-02, PLACEHOLDER-USA-02, PLACEHOLDER-USA-01

# Layer 4: Dev-AI (Cursor/Copilot)
# Dev-AI = url-test, url=https://www.gstatic.com/generate_204, interval=300, timeout=5000, PLACEHOLDER-SG-01, PLACEHOLDER-SG-02, PLACEHOLDER-USA-01

# Layer 5: Social — fallback, -02 priority
# Social = fallback, url=https://discord.com/api/v1/ping, interval=120, timeout=5000, PLACEHOLDER-SG-02, PLACEHOLDER-USA-02, PLACEHOLDER-SG-01, PLACEHOLDER-USA-01

# Layer 6: Dev-Svc — fallback, high frequency
# Dev-Svc = fallback, url=https://www.gstatic.com/generate_204, interval=300, timeout=5000, PLACEHOLDER-SG-02, PLACEHOLDER-USA-02, PLACEHOLDER-SG-01, PLACEHOLDER-USA-01

# Layer 7: Web3 — fallback
# Web3 = fallback, url=https://www.gstatic.com/generate_204, interval=180, timeout=5000, PLACEHOLDER-SG-02, PLACEHOLDER-USA-02, PLACEHOLDER-SG-01

# Layer 8: Streaming — fallback for session continuity
# Streaming = fallback, url=https://www.youtube.com, interval=180, timeout=5000, PLACEHOLDER-SG-02, PLACEHOLDER-USA-02, PLACEHOLDER-SG-01

# Layer 9: Proxy (catch-all) — exclude UK/Warp
# Proxy = url-test, url=https://www.gstatic.com/generate_204, interval=180, timeout=5000, PLACEHOLDER-SG-01, PLACEHOLDER-SG-02, PLACEHOLDER-USA-01

[Proxy Group]

[Rule]
# Remote rulesets not supported in Shadowrocket — use manual domain rules

