  - DOMAIN-SUFFIX,x.ai,AI-Services
  - DOMAIN-SUFFIX,grok.com,AI-Services
  - DOMAIN-SUFFIX,perplexity.ai,CF-Strict
  - DOMAIN-SUFFIX,mistral.ai,CF-Strict
  - DOMAIN-SUFFIX,poe.com,CF-Strict
  - DOMAIN-SUFFIX,cohere.com,AI-Services
  - DOMAIN-SUFFIX,character.ai,AI-Services

  # Dev AI
  - DOMAIN-SUFFIX,cursor.com,Dev-AI
  - DOMAIN-SUFFIX,cursor.sh,Dev-AI
  - DOMAIN-SUFFIX,githubcopilot.com,Dev-AI
  - DOMAIN-SUFFIX,replit.com,Dev-AI

  # Social
  - DOMAIN-SUFFIX,telegram.org,Social
  - DOMAIN-SUFFIX,t.me,Social
  - DOMAIN-SUFFIX,discord.com,Social
  - DOMAIN-SUFFIX,discordapp.com,Social
  - DOMAIN-SUFFIX,whatsapp.com,Social
  - DOMAIN-SUFFIX,x.com,Social
  - DOMAIN-SUFFIX,twimg.com,Social

  # Dev Services
  - DOMAIN-SUFFIX,github.com,Dev-Svc
  - DOMAIN-SUFFIX,githubusercontent.com,Dev-Svc
  - DOMAIN-SUFFIX,docker.com,Dev-Svc
  - DOMAIN-SUFFIX,docker.io,Dev-Svc
  - DOMAIN-SUFFIX,pypi.org,Dev-Svc
  - DOMAIN-SUFFIX,npmjs.com,Dev-Svc
  - DOMAIN-SUFFIX,vercel.com,Dev-Svc

  # Streaming
  - DOMAIN-SUFFIX,netflix.com,Streaming
  - DOMAIN-SUFFIX,nflxvideo.net,Streaming
  - DOMAIN-SUFFIX,disneyplus.com,Streaming
  - DOMAIN-SUFFIX,youtube.com,Streaming
  - DOMAIN-SUFFIX,ytimg.com,Streaming
  - DOMAIN-SUFFIX,googlevideo.com,Streaming
