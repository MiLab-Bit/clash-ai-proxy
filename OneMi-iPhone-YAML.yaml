# ============================================================
# OneMi — AI Proxy for iPhone / mihomo (ProxyMD / Sing-box YACL)
# 内部版本 1.1 | 2026-10-05
# 11 层 AI 分流架构 / MRS 原生规则集 / strict-route false / fake-ip 持久化
# 适用：iPhone 15 / iOS 17+ / mihomo 内核（ProxyMD 等）
# 使用方法：ProxyMD → 配置 → 导入此 YAML
# ⚠️ strict-route: false（iOS 不卡 Apple 推送）
# ⚠️ 无 dns.listen / 无 external-controller（iOS 沙箱限制）
# ============================================================
mode: rule
mixed-port: 7890
allow-lan: false
log-level: warning
ipv6: false
unified-delay: true
tcp-concurrent: true
geodata-mode: true
geox-url:
  geoip: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip.dat
  geosite: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite.dat
  mmdb: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/country.mmdb
geo-auto-update: true
geo-update-interval: 168
keep-alive-interval: 30
global-client-fingerprint: chrome
tun:
  enable: true
  stack: system
  auto-route: true
  strict-route: false
  auto-detect-interface: true
  dns-hijack:
  - any:53
  - tcp://any:53
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: false
  override-destination: false
  sniff:
    TLS:
      ports:
      - 443
      - 8443
    HTTP:
      ports:
      - 80
      - 8080-8880
    QUIC:
      ports:
      - 443
      - 8443
  skip-domain:
  - +.bank.example
  - +.icbc.com.cn
  - +.cmbchina.com
  - +.bankcomm.com
  - Mijia Cloud
  - +.apple.com
  - +.icloud.com
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  prefer-h3: false
  respect-rules: true
  use-hosts: true
  use-system-hosts: false
  cache-algorithm: arc
  fake-ip-filter:
  - '*.lan'
  - '*.local'
  - '*.arpa'
  - time.*.com
  - ntp.*.com
  - +.market.xiaomi.com
  - localhost.ptlogin2.qq.com
  - '*.msftncsi.com'
  - www.msftconnecttest.com
  - +.googleapis.com
  - +.googleusercontent.com
  - +.ggpht.com
  - +.play.google.com
  - +.android.clients.google.com
  - +.connectivitycheck.gstatic.com
  - +.samsung.com
  - +.samsungcloud.com
  - +.securesamsungcloud.com
  default-nameserver:
  - 119.29.29.29
  - 223.5.5.5
  nameserver:
  - https://doh.pub/dns-query
  - https://dns.alidns.com/dns-query
  fallback:
  - https://dns.google/dns-query
  - https://1.1.1.1/dns-query
  nameserver-policy:
    geosite:cn:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
    geosite:google:
    - https://dns.google/dns-query
    geosite:openai:
    - https://dns.google/dns-query
    geosite:anthropic:
    - https://dns.google/dns-query
    geosite:gemini:
    - https://dns.google/dns-query
    geosite:apple:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
    geosite:microsoft:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
    geosite:category-ads-all: rcode://success
  proxy-server-nameserver:
  - https://doh.pub/dns-query
  - https://dns.alidns.com/dns-query
  direct-nameserver:
  - https://doh.pub/dns-query
  - https://dns.alidns.com/dns-query
  direct-nameserver-follow-policy: true
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
    - 240.0.0.0/4
    - 100.64.0.0/10               # v5.6: 补 CGNAT 网段
    # v1.1: 删 0.0.0.0/32（纯噪音 IP，不会出现在真实解析中）
profile:
  store-selected: true
  store-fake-ip: true
rule-providers:
  geosite-ai:
    type: http
    behavior: classical
    format: mrs
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-ai-chat-!cn.mrs
    path: ./ruleset/meta/geosite-ai.mrs
    interval: 86400
  geosite-cn:
    type: http
    behavior: classical
    format: mrs
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/cn.mrs
