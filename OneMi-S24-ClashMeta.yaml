rules:
# ---- v5.3: 局域网/私有地址最先直连（防 NAS/打印机/热点泄漏）----
- IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
- IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
- IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
- IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
- IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
# v1.4: 删除 GEOIP,private,DIRECT,no-resolve——上方 5 条 IP-CIDR 已完整覆盖
#       RFC1918 + loopback + CGNAT 私有地址段，此规则冗余。保留它反而会在
#       GeoIP.dat 缓存损坏时报 "cannot parse invalid wire-format data" 导致启动失败。
# v1.2: blackmatrix7 RULE-SET 规则集已删除（对应 rule-providers 被封锁），由下方 GEOSITE 规则兜底
