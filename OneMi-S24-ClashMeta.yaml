# ============================================================
# OneMi — AI Proxy for Samsung S24 / Android / ClashMeta
# 内部版本 1.1 | 2026-10-05（v1.1：MRS meta 分支统一 / 0.0.0.0/32 清除 / 广告去重）
# 11 层 AI 分流架构 / MRS 原生规则集 / TUN mixed / fake-ip 持久化
# 适用：三星 S24 / 安卓 14 + ClashMeta for Android
# 使用方法：传到手机 -> ClashMeta -> 配置 -> 从文件导入
# ⚠️ 安卓设置 → 连接 → 更多连接 → 私人 DNS → 必须选"关闭"
# ⚠️ 开热点/USB共享 → 先改 strict-route: false
# ⚠️ CMFA 默认选组：Gemini→Google-AI / ChatGPT→AI-Proxy / 其他→Proxy
# ============================================================

mode: rule
mixed-port: 7890
allow-lan: false
log-level: warning
ipv6: false
external-controller: 127.0.0.1:9090
secret: YOUR_S24_DASHBOARD_SECRET    # v5.5: 随机强密码（每台设备不同）
unified-delay: true
tcp-concurrent: true
geodata-mode: true
geox-url:
  geoip: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip.dat
  geosite: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite.dat
  mmdb: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/country.mmdb
geo-auto-update: true
geo-update-interval: 168
keep-alive-interval: 30
global-client-fingerprint: chrome
tun:
  enable: true
  stack: mixed                            # v5.2: mixed（TCP=system + UDP=gvisor），比纯 system 更兼容 ROM + UDP 游戏更稳
  auto-route: true
  strict-route: true                      # 防泄漏——自用没事，要开热点/USB 共享改成 false
  auto-detect-interface: true
  mtu: 1500                               # v5.3: 防 WiFi/5G 切换时 UDP 卡死（默认 9000 太大）
  dns-hijack:
  - any:53
  - tcp://any:53                          # v5.2: 补 TCP/53，有些 App 走 TCP DNS（单纯 UDP/53 拦不住）
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: false
  override-destination: false
  sniff:
    TLS:
      ports:
      - 443
      - 8443
    HTTP:
      ports:
      - 80
      - 8080-8880
    QUIC:
      ports:
      - 443
      - 8443
  skip-domain:
  - +.bank.example
  - +.icbc.com.cn
  - +.cmbchina.com
  - +.bankcomm.com
  - Mijia Cloud
  - +.apple.com
  - +.icloud.com
dns:
  enable: true
  listen: 127.0.0.1:1053          # v5.6: 收窄攻击面（0.0.0.0 → 127.0.0.1）
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  prefer-h3: false
  respect-rules: true
  use-hosts: true
  use-system-hosts: false
  cache-algorithm: arc                    # v5.4: ARC 缓存算法，命中率比默认好
  fake-ip-filter:
  - '*.lan'
  - '*.local'
  - '*.arpa'
  - time.*.com
  - ntp.*.com
  - +.market.xiaomi.com
  - localhost.ptlogin2.qq.com
  - '*.msftncsi.com'
  - www.msftconnecttest.com
  - +.googleapis.com
  - +.googleusercontent.com
  - +.ggpht.com
  - +.play.google.com
  - +.android.clients.google.com
  - +.connectivitycheck.gstatic.com
  - +.samsung.com
  - +.samsungcloud.com
  - +.securesamsungcloud.com
  # S24 评审: 删 openai/chatgpt/anthropic/claude/gemini 的 fake-ip 放行
  # 理由：规则顺序已修（细分在前），域名匹配先命中走代理，不需要放行真 IP
  # 保留反而会让 TUN 下连接阶段只剩 IP，sniffer 没命中时可能走错路
  default-nameserver:
  - 119.29.29.29
  - 223.5.5.5
  nameserver:
  - https://doh.pub/dns-query
  - https://dns.alidns.com/dns-query
  fallback:
  - https://dns.google/dns-query
  - https://1.1.1.1/dns-query
  # v5.4: 按 GEOSITE 分层 DNS，比手写十行 policy 更好维护
  nameserver-policy:
    "geosite:cn": ['https://doh.pub/dns-query', 'https://dns.alidns.com/dns-query']
    "geosite:google": ['https://dns.google/dns-query']
    "geosite:openai": ['https://dns.google/dns-query']
    "geosite:anthropic": ['https://dns.google/dns-query']
    "geosite:gemini": ['https://dns.google/dns-query']
    "geosite:apple": ['https://doh.pub/dns-query', 'https://dns.alidns.com/dns-query']
    "geosite:microsoft": ['https://doh.pub/dns-query', 'https://dns.alidns.com/dns-query']
    # v5.4: 广告域名静默返回空——比 REJECT 更不容易出现"加载转圈"
    "geosite:category-ads-all": rcode://success
  proxy-server-nameserver:
  - https://doh.pub/dns-query
  - https://dns.alidns.com/dns-query
  # v5.5: 直连流量专用 DNS——国内/Apple 直连时不走代理、不被 fake-ip 污染
  direct-nameserver:
  - https://doh.pub/dns-query
  - https://dns.alidns.com/dns-query
  direct-nameserver-follow-policy: true     # 直连 DNS 也遵守 nameserver-policy
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
    - 240.0.0.0/4
    - 100.64.0.0/10               # v5.6: 补 CGNAT 网段
    # v5.6: 删 domain 三段（fake-ip + nameserver-policy 已管，v4 时代残留）
    # v1.1: 删 0.0.0.0/32（纯噪音 IP，不会出现在真实解析中）
profile:
  store-selected: true
  store-fake-ip: true                      # v5.4: 持久化 fake-ip，重载配置后 AI 域名不用重新解析
# v5.7: 改用 proxy-providers 自动拉取机场节点，不再手贴
# 换机场只改下面的 url 即可，规则和策略组不用动
proxy-providers:
  fightlyd:
    type: http
    url: https://www.fightlyd.site/api/v1/client/subscribe?token=YOUR_SUBSCRIBE_TOKEN
    interval: 86400                         # 24h 自动更新一次
    path: ./proxy_providers/fightlyd.yaml
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
    filter: "SG-|USA-|HK-|JP-|AU-|LU-|UK-"  # 过滤掉"剩余流量/到期时间"等信息节点
    override:
      skip-cert-verify: false               # 收紧：机场默认 true，我们覆盖成 false
rule-providers:
  # v5.5: mihomo 原生 MRS 格式（比 YAML 解析快、体积小、更新规范）
  geosite-ai:
    type: http
    behavior: classical
    format: mrs
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-ai-chat-!cn.mrs
    path: ./ruleset/meta/geosite-ai.mrs
    interval: 86400
  geosite-cn:
    type: http
    behavior: classical
    format: mrs
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/cn.mrs
    path: ./ruleset/meta/geosite-cn.mrs
    interval: 86400
  geosite-ads:
    type: http
    behavior: classical
    format: mrs
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-ads-all.mrs
    path: ./ruleset/meta/geosite-ads.mrs
    interval: 86400
  geoip-cn:
    type: http
    behavior: classical
    format: mrs
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/cn.mrs
    path: ./ruleset/meta/geoip-cn.mrs
    interval: 86400
  # blackmatrix7 YAML 备用（更细粒度，AI 服务专用）
  openai-direct:
    type: http
    behavior: classical
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/OpenAI/OpenAI.yaml
    path: ./ruleset/blackmatrix7/openai.yaml
    interval: 86400
  gemini-direct:
    type: http
    behavior: classical
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Gemini/Gemini.yaml
    path: ./ruleset/blackmatrix7/gemini.yaml
    interval: 86400
  claude-direct:
    type: http
    behavior: classical
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Claude/Claude.yaml
    path: ./ruleset/blackmatrix7/claude.yaml
    interval: 86400
  copilot-direct:
    type: http
    behavior: classical
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/GithubCopilot/GithubCopilot.yaml
    path: ./ruleset/blackmatrix7/copilot.yaml
    interval: 86400
  telegram-direct:
    type: http
    behavior: classical
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Telegram/Telegram.yaml
    path: ./ruleset/blackmatrix7/telegram.yaml
    interval: 86400
  netflix-direct:
    type: http
    behavior: classical
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Netflix/Netflix.yaml
    path: ./ruleset/blackmatrix7/netflix.yaml
    interval: 86400
  spotify-direct:
    type: http
    behavior: classical
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Spotify/Spotify.yaml
    path: ./ruleset/blackmatrix7/spotify.yaml
    interval: 86400
  discord-direct:
    type: http
    behavior: classical
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Discord/Discord.list
    path: ./ruleset/blackmatrix7/discord.yaml
    interval: 86400
proxy-groups:
# v5.7: 所有组用 use: [fightlyd] 引用订阅节点，不再硬编码
