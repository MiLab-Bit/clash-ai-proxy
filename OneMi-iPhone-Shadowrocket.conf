CF-Strict = select, USA-01, USA-02, SG-01, SG-02, JP-02, AU-01, LU-01

Social = fallback, url=https://discord.com/api/v1/ping, interval=300, timeout=5000, SG-02, USA-02, HK-02, SG-01, USA-01, JP-02

Dev-Svc = fallback, url=https://www.gstatic.com/generate_204, interval=300, timeout=5000, SG-02, USA-02, HK-02, SG-01, USA-01, JP-02

Web3 = fallback, url=https://www.gstatic.com/generate_204, interval=300, timeout=5000, SG-02, USA-02, HK-02, SG-01, JP-02

Finance = fallback, url=https://www.gstatic.com/generate_204, interval=300, timeout=5000, SG-02, USA-02, HK-02, SG-01, JP-02

Game-Media = fallback, url=https://www.gstatic.com/generate_204, interval=300, timeout=5000, SG-02, USA-02, HK-02, SG-01, JP-02

Shopping = fallback, url=https://www.gstatic.com/generate_204, interval=300, timeout=5000, SG-02, USA-02, HK-02, SG-01, JP-02

Proxy = url-test, url=https://www.gstatic.com/generate_204, interval=300, tolerance=80, timeout=5000, SG-02, USA-02, SG-01, USA-01, JP-02, AU-02, HK-02, JP-01, AU-01, HK-01

