# ============================================================
# OneMi — AI Proxy for iPhone / Shadowrocket
# 内部版本 1.1 | 2026-10-05（v1.1：MRS meta 分支统一 / 0.0.0.0/32 清除 / 广告去重）
# 11 层 AI 分流架构 / DNS 分流 / QUIC 加速 / 广告拦截
# 适用：iPhone 15 / iOS 17+ / Shadowrocket 2.2.50+
# 使用方法：通过 iCloud/文件 APP 导入到 Shadowrocket → 配置 → 还原
#
# iOS 专属注意事项（与 S24/Windows 版的差异）：
#   1. strict-route 无效 — SR 用自己的 VPN 接管，不走 mihomo TUN
#   2. dns.listen 无效 — SR 自行接管 DNS
#   3. external-controller 无效 — iOS 沙盒内无法外部访问
#   4. Apple 推送域名全部直连（push/feedback/gsp-ocsp/validation/mask/ckdatabase）
#   5. ⚠️ 设置 → Apple ID → iCloud → Private Relay：必须关掉，否则 Safari 部分请求不走 SR
#   6. ⚠️ iOS 26 DNS 预取 / WebAuthn 通行密钥走系统层，TUN 管不到（正常现象）
# ============================================================

[General]
bypass-system-rules = true
allow-wifi-hotspot = false
udp-policy-not-follow-proxy = false
ipv6 = false
dns-server = 223.5.5.5, 119.29.29.29, https://1.1.1.1/dns-query, system
fallback-dns-server = https://1.1.1.1/dns-query, https://dns.google/dns-query
proxy-test-url = https://www.gstatic.com/generate_204
proxy-test-udp = www.google.com:80@8.8.8.8
# v6: 删 AI 域名 always-real-ip（规则顺序已修，域名匹配先命中走代理）
# 保留连通性检测和推送相关域名
always-real-ip = localhost, *.lan, *.local, time.*.com, ntp.*.com, *.msftncsi.com, www.msftconnecttest.com, +.market.xiaomi.com
always-real-ip-ms-except = *.cn, *.baidu.com
quic-debug = false
internet-stable-interval = 30
# v6: DNS 静默广告（替代 GEOSITE,category-ads-all,REJECT）
dns-direct = 223.5.5.5, 119.29.29.29
dns-fallback = https://1.1.1.1/dns-query, https://dns.google/dns-query

[Proxy]
# ============================================================
#  11 层策略组
# ============================================================

Google-AI = fallback, url=https://www.gstatic.com/generate_204, interval=300, timeout=5000, SG-02, USA-02, SG-01, USA-01, AU-02, AU-01, HK-02, HK-01

AI-Proxy = url-test, url=https://chatgpt.com/cdn-cgi/trace, interval=180, tolerance=120, timeout=5000, SG-02, USA-02, SG-01, USA-01, AU-02, AU-01, JP-02, LU-02, LU-01

